openapi: 3.0.3
info:
  title: URL Shortener with Analytics API
  version: 1.0.0
  description: |
    Redis-cached redirects, JWT auth, and MongoDB aggregation dashboards.

    The redirect endpoint (`GET /{code}`) is unauthenticated and is the hot path:
    it answers from Redis, and only touches MongoDB on a cache miss.
servers:
  - url: http://localhost:3000
    description: Local

tags:
  - name: Auth
  - name: URLs
  - name: Analytics
  - name: System

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
            details:
              type: object
              additionalProperties: true
      required: [error]

    User:
      type: object
      properties:
        id: { type: string, example: 66a1f2c3e4b0a1d2c3e4f5a6 }
        email: { type: string, format: email }
        createdAt: { type: string, format: date-time }

    AuthResponse:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresIn: { type: string, example: 15m }

    Url:
      type: object
      properties:
        id: { type: string }
        code: { type: string, example: aB3xY9z }
        shortUrl: { type: string, example: http://localhost:3000/aB3xY9z }
        longUrl: { type: string, format: uri }
        title: { type: string, nullable: true }
        customAlias: { type: boolean }
        totalClicks: { type: integer }
        maxClicks: { type: integer, nullable: true }
        isActive: { type: boolean }
        expiresAt: { type: string, format: date-time, nullable: true }
        isExpired: { type: boolean }
        isExhausted: { type: boolean }
        createdAt: { type: string, format: date-time }

  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 12, example: correct-horse-battery }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Email already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Exchange credentials for tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Tokens issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate a refresh token
      description: The presented token is single-use and is revoked on use.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke a refresh token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        '200': { description: Revoked }

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Current user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/urls:
    post:
      tags: [URLs]
      summary: Create a short URL
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [longUrl]
              properties:
                longUrl: { type: string, format: uri, example: https://example.com/very/long/path }
                customAlias: { type: string, minLength: 3, maxLength: 32, pattern: '^[A-Za-z0-9_-]+$' }
                title: { type: string, maxLength: 200 }
                expiresAt: { type: string, format: date-time }
                maxClicks: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Link created
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { $ref: '#/components/schemas/Url' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Alias already taken
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [URLs]
      summary: List your links
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { in: query, name: isActive, schema: { type: string, enum: ['true', 'false'] } }
      responses:
        '200':
          description: Paginated links
          content:
            application/json:
              schema:
                type: object
                properties:
                  urls:
                    type: array
                    items: { $ref: '#/components/schemas/Url' }
                  pagination:
                    type: object
                    properties:
                      page: { type: integer }
                      limit: { type: integer }
                      total: { type: integer }
                      pages: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/urls/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [URLs]
      summary: Fetch one of your links
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The link
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { $ref: '#/components/schemas/Url' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [URLs]
      summary: Update or deactivate a link
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                longUrl: { type: string, format: uri }
                title: { type: string, nullable: true }
                isActive: { type: boolean }
                expiresAt: { type: string, format: date-time, nullable: true }
                maxClicks: { type: integer, nullable: true, minimum: 1 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { $ref: '#/components/schemas/Url' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [URLs]
      summary: Delete a link
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/urls/{id}/analytics:
    get:
      tags: [Analytics]
      summary: Clicks and unique visitors
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - in: query
          name: range
          schema: { type: string, enum: ['24h', '7d', '30d', '90d', 'all'], default: 7d }
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  analytics:
                    type: object
                    properties:
                      range: { type: string }
                      totalClicks: { type: integer }
                      uniqueVisitors: { type: integer }
                      lifetimeClicks: { type: integer }
                      firstClickAt: { type: string, format: date-time, nullable: true }
                      lastClickAt: { type: string, format: date-time, nullable: true }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/urls/{id}/analytics/timeseries:
    get:
      tags: [Analytics]
      summary: Clicks per day or hour
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: query, name: range, schema: { type: string, enum: ['24h', '7d', '30d', '90d', 'all'], default: 7d } }
      responses:
        '200':
          description: Time series with empty buckets filled in
          content:
            application/json:
              schema:
                type: object
                properties:
                  analytics:
                    type: object
                    properties:
                      range: { type: string }
                      unit: { type: string, enum: [hour, day] }
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            bucket: { type: string }
                            clicks: { type: integer }
                            uniqueVisitors: { type: integer }

  /api/urls/{id}/analytics/breakdown:
    get:
      tags: [Analytics]
      summary: Top values per dimension
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: query, name: range, schema: { type: string, enum: ['24h', '7d', '30d', '90d', 'all'], default: 7d } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        '200':
          description: Breakdowns by country, device, browser, referrer and os

  /api/urls/{id}/analytics/recent:
    get:
      tags: [Analytics]
      summary: Most recent raw clicks
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Recent clicks, newest first }

  /api/urls/{id}/analytics/daily:
    get:
      tags: [Analytics]
      summary: Pre-aggregated daily rollups
      description: Reads O(days) documents rather than scanning every raw click.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 365, default: 30 } }
      responses:
        '200': { description: Daily counters }

  /{code}:
    get:
      tags: [URLs]
      summary: Redirect to the long URL
      description: |
        Returns **302**, never 301: browsers cache a 301 permanently, so repeat
        visits would never reach this server and the click would go unrecorded.
        The response carries `X-Cache: hit|miss` for benchmarking.
      parameters:
        - { in: path, name: code, required: true, schema: { type: string } }
      responses:
        '302':
          description: Redirect
          headers:
            Location: { schema: { type: string } }
            X-Cache: { schema: { type: string, enum: [hit, miss] } }
        '404': { description: Unknown code, returns an HTML page }
        '410': { description: Expired, deactivated or exhausted, returns an HTML page }

  /health:
    get:
      tags: [System]
      summary: Liveness and dependency status
      responses:
        '200': { description: Service is up }
